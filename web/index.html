<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="SJDR Bus: tiempos estimados de autobús para San Juan del Río, Qro. Iniciativa ciudadana independiente." />
    <meta name="theme-color" content="#0d7a72" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./iconos/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
    <title>SJDR Bus</title>
  </head>
  <body>
    <div class="app">
      <main id="mapa" class="mapa" aria-label="Mapa de San Juan del Río"></main>
      <!-- D-48: arriba, sobre el mapa, lo que pide la regla 5 (selector + sentido),
           y el botón del menú lateral, a la izquierda. En teléfono el nombre va dentro
           del menú; en computadora, en la barra de arriba. Con el menú abierto, el
           buscador y el sentido pasan a la cabeza del menú (buscador y planeador). -->
      <header class="barra" id="barra">
        <button type="button" class="boton-menu" id="boton-menu" aria-label="Menú de rutas" aria-expanded="false" aria-controls="hoja"></button>
        <span class="marca-barra">SJDR Bus</span>
        <form class="controles" id="controles" aria-label="Elige ruta y sentido">
          <div class="buscador">
            <label for="ruta">Ruta</label>
            <svg class="icono-izq" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d7a72" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <select id="ruta" name="ruta">
              <option value="" disabled selected>¿A dónde vas? Elige tu ruta</option>
            </select>
            <svg class="icono-der" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#66767c" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <fieldset class="sentido" id="sentido" hidden>
            <legend>Sentido</legend>
            <div class="segmento apagado" id="segmento">
              <label><input type="radio" name="sentido" value="ida" checked /><span>Ida<small id="sub-ida"></small></span></label>
              <label><input type="radio" name="sentido" value="vuelta" /><span>Vuelta<small id="sub-vuelta"></small></span></label>
            </div>
          </fieldset>
        </form>
      </header>
      <button type="button" class="ver-detalle" id="ver-detalle" aria-controls="hoja" hidden></button>
      <p class="pie" id="pie">Iniciativa ciudadana independiente · no oficial · datos en proceso de validación</p>
      <div class="velo" id="velo" hidden></div>
      <aside class="hoja cerrada" id="hoja" aria-label="Menú de SJDR Bus">
        <div class="hoja-cabeza">
          <div class="logo" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r=".6" fill="#fff"/><circle cx="16" cy="14.5" r=".6" fill="#fff"/></svg>
          </div>
          <div class="hoja-marca">
            <h1 class="nombre">SJDR Bus</h1>
            <p class="leyenda">Iniciativa ciudadana independiente</p>
          </div>
          <button type="button" class="cerrar" id="cerrar-menu" aria-label="Cerrar el menú"></button>
        </div>
        <div class="hoja-cuerpo">
          <div id="modo-rutas" class="modo">
            <h2 class="hoja-titulo" id="hoja-titulo">Elige tu ruta</h2>
            <!-- D-50: selector visual. Las 39 rutas en tarjetas, en el orden de
                 routes.txt; el <select> de arriba se queda como respaldo. -->
            <div class="selector-visual" id="selector-visual">
              <section class="recientes" id="recientes" aria-labelledby="recientes-titulo" hidden>
                <div class="recientes-cabeza">
                  <h3 id="recientes-titulo">Tus rutas recientes</h3>
                  <button type="button" class="borrar-recientes" id="borrar-recientes">Borrar</button>
                </div>
                <div class="rejilla-tarjetas" id="lista-recientes"></div>
              </section>
              <p class="aviso-colores" id="aviso-colores"></p>
              <div class="rejilla-tarjetas" id="tarjetas" aria-label="Las rutas"></div>
            </div>
            <div class="encabezado-ruta" id="encabezado-ruta" hidden></div>
            <section id="detalle" class="detalle" aria-live="polite" aria-label="Detalle de la ruta" hidden></section>
          </div>
          <section id="modo-calcula" class="modo calcula" aria-labelledby="calcula-titulo" hidden></section>
        </div>
        <nav class="pestanas" id="pestanas" aria-label="Modo de la app">
          <button type="button" id="pestana-rutas" class="activo" aria-pressed="true" aria-controls="modo-rutas">Rutas</button>
          <button type="button" id="pestana-calcula" aria-pressed="false" aria-controls="modo-calcula">Calcula tu ruta</button>
        </nav>
      </aside>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
