<link rel="stylesheet" href="../../../node_modules/leaflet/dist/leaflet.css" />
<style>
:root {
  --tinta: #12262d; --primario: #0d7a72; --primario-suave: #e3f2ef;

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
/* D-59, 1: la página no se acerca con el pellizco ni con doble toque; solo el mapa

html, body { touch-action: pan-x pan-y; }

/* ── Barra de arriba (teléfono): ☰ · «¿A dónde quieres ir?» · paradas ── */
.barra {

/* Tarjetas (D-53, 3 y 4): sin «Ruta 001», 20 colores.

.tarjeta-nombre {

/* D-55, 2 · últimos cambios (Miguel, 20 nov 2026): la tarjeta partida a la mitad

.tarjeta.partida {
  grid-template-columns: 36px minmax(0, 1fr); align-items: center; justify-items: stretch;

  font-size: 11.5px; font-weight: 800; line-height: 1.3; white-space: nowrap; letter-spacing: -0.03em;
}
/* 10:10 pm: la letra se ajusta a cada tarjeta (más chica y delgada si el nombre es

.tarjeta.partida .tarjeta-nombre {
  display: block; -webkit-line-clamp: none; overflow: hidden; align-self: stretch;

}
.tarjeta.partida .tarjeta-nombre > span { display: block; }
.tarjeta.partida .tarjeta-nombre b { font-weight: inherit; white-space: nowrap; }

/* D-58, 2: la tarjeta de ruta en píldora. Mismo alto, mismas 3 columnas y la misma

.bienvenida-cabeza { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

   la muestra en el mapa con su ficha; a la derecha, un botón de ícono (ubicación
   con flecha de actualizar) vuelve a leer el GPS, sin texto. */
.parada-hallada { display: flex; align-items: stretch; gap: 8px; }
.ver-parada {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 16px 8px 16px;
  border: 0; border-radius: 999px; /* D-58: píldora (antes 14px y 8px 10px 8px 12px) */ background: var(--primario-suave); box-shadow: inset 0 0 0 2px var(--primario);
  text-align: left; cursor: pointer;
}
.ver-parada svg { flex: none; }
.ver-parada b { display: block; font-size: 14px; }
.ver-parada small { display: block; font-size: 11.5px; color: var(--suave); }
.ver-parada .flecha { margin-left: auto; color: var(--primario); }
.otra {
  flex: none; width: 52px; height: 52px; align-self: center; border: 0; border-radius: 50%; background: var(--primario); color: #fff; /* D-58: círculo (antes 14px) */
  display: grid; place-items: center; cursor: pointer;
}
.ficha-parada { display: grid; gap: 2px; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: var(--tinta); }
.ficha-parada b { font-size: 14px; }
.ficha-parada span { color: var(--suave); }
.ficha-parada .marca-verificar { color: #8a5300; font-weight: 800; letter-spacing: 0.03em; }
/* Las tarjetas de «cerca» igual que en la app (D-53): D-57 no las cambia (lección 14). */
.rejilla.cerca .tarjeta { gap: 3px; padding: 5px 6px 6px; }
.rejilla.cerca .camion { font-size: 11px; padding: 1px 5px 1px 4px; border-radius: 6px; letter-spacing: -0.01em; }
.rejilla.cerca .camion svg { width: 11px; height: 11px; }
.rejilla.cerca .tarjeta-nombre { font-size: 10px; font-weight: 700; line-height: 1.2; }
.nota { margin: 6px 0 0; font-size: 10.5px; line-height: 1.4; color: var(--primario); }
.proximamente { margin: 0; font-size: 10.5px; line-height: 1.4; color: var(--primario); }

/* D-56f2, ajuste (Miguel, 22 nov 2026, 9:18 pm): «Salgo de otro lugar» es otro círculo
   en el mismo renglón que tu parada y el botón de ubicación, con un ícono: pin con
   lápiz (cambiar el lugar de salida). Contorno, para no confundirlo con el del GPS. */
.otra.salida-otra { background: var(--tarjeta); color: var(--primario); box-shadow: inset 0 0 0 2px var(--primario); }
.fila-salida { display: flex; align-items: center; gap: 8px; }
.fila-salida .ubicacion { flex: 1; min-width: 0; }
/* D-56f2, opción C (Miguel, 22 nov 2026, 9:25 pm): los tres en el mismo renglón y los
   círculos del mismo tamaño (52 px); el texto chico de la línea pasa debajo del renglón,
   a todo el ancho, y el nombre de la parada baja 25 % (14 → 10.5 px). Solo en el renglón
   de tu parada; la línea de la parada del destino no cambia. */
.nota-parada { margin: 6px 0 0 4px; font-size: 11.5px; color: var(--suave); }
.parada-hallada.f2 .ver-parada small { display: none; }
.parada-hallada.f2 .ver-parada b { font-size: 10.5px; }
/* D-56f2: campo «¿Desde dónde sales?»: igual que «¿A dónde quieres ir?», más bajo. */
.campo.salida { height: 44px; font-size: 15px; }
.campo .quitar { margin-left: auto; width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--fondo); color: var(--suave); display: grid; place-items: center; }
.titulo-seccion.f2 { margin-top: 0; }
/* D-56f2: en la app el campo es un <input> de una línea; en la maqueta, el texto largo se corta igual. */
.campo .texto-f2 { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* D-56f2: la lista de lugares es larga; cada fila dice su tipo y su fuente. */
.resultados-f2 { display: grid; gap: 6px; }
.resultado .tipo { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--tarjeta); color: var(--primario); }
/* D-56f2: la parada más cercana al destino, con el mismo botón de D-57 en color destino. */
.ver-parada.destino { background: #fbece7; box-shadow: inset 0 0 0 2px #a8432a; }
.ver-parada.destino .flecha { color: #a8432a; }
.pin-lugar span { padding: 3px 9px; border-radius: 13px; font-size: 12px; font-weight: 800; color: #fff; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(18,38,45,.3); white-space: nowrap; }
.pin-lugar { background: none; border: 0; display: flex; justify-content: center; }
/* D-56f2r (pedido de Miguel, 22 nov 2026, 10:23 pm): la lista enseña 5 y un botón para
   ver 5 más; sin fondo, para que no compita con los resultados. */
.ver-mas { width: 100%; min-height: 44px; border: 0; border-radius: 999px; background: none; box-shadow: inset 0 0 0 2px var(--primario-suave); color: var(--primario); font-size: 14px; font-weight: 700; cursor: pointer; }

/* Marcadores */
.pin { background: none; border: 0; }
.pin svg { display: block; filter: drop-shadow(0 2px 3px rgba(18,38,45,.35)); }
.etq-zona { background: none; border: 0; display: flex; justify-content: center; }
.etq-zona span { padding: 3px 9px; border-radius: 13px; font-size: 12px; font-weight: 800; color: #fff; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(18,38,45,.3); white-space: nowrap; }
.yo { width: 16px; height: 16px; border-radius: 50%; background: #1d5b8f; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(29,91,143,.25); }

/* D-59, 2: teléfono acostado = como teléfono parado. Respeta la muesca (la barra y
   el zoom no se meten debajo de ella). */
.barra { left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); }
.leaflet-right .leaflet-control-zoom.leaflet-bar { margin-right: max(12px, env(safe-area-inset-right)); }

/* D-61 (Miguel, 21 nov 2026, 2:29 am), teléfono parado: el zoom va arriba a la derecha,
   abajo del botón de paradas (barra 10 px + 52 px + 12 px de espacio), y debajo, con
   10 px de espacio, un círculo «mi ubicación». main.ts los acomoda solo en parado. */
.leaflet-top.leaflet-right { margin-top: 64px; }
.leaflet-top.leaflet-right .leaflet-control-zoom.leaflet-bar { margin: 10px max(12px, env(safe-area-inset-right)) 0 0; }
.leaflet-top.leaflet-right .ubicame {
  width: 46px; height: 46px; margin: 10px max(12px, env(safe-area-inset-right)) 0 0; padding: 0;
  border: 0; border-radius: 50%; background: var(--tarjeta); box-shadow: var(--sombra);
  display: grid; place-items: center; color: var(--primario); cursor: pointer;
}

/* D-62 (Miguel, 22 nov 2026, 3:39 pm): el círculo «mi ubicación» también acostado y
   en computadora. Ajuste (3:43 pm): en computadora el zoom y el círculo van arriba a
   la derecha, como en parado (primero «+ / −», abajo el círculo), 12 px bajo la barra
   verde. Acostado: el zoom no se mueve (D-60) y el círculo va a la izquierda del zoom,
   alineado con su parte de abajo, con 10 px de espacio (medido: en columna no cabe a
   844 × 212, se encimaría con el botón de paradas). */
@media (min-width: 768px) and (min-height: 501px) {
  .leaflet-top.leaflet-right { margin-top: 2px; }
}
.leaflet-bottom.leaflet-right .ubicame {
  width: 46px; height: 46px; margin: 0 max(12px, env(safe-area-inset-right)) 10px 0; padding: 0;
  border: 0; border-radius: 50%; background: var(--tarjeta); box-shadow: var(--sombra);
  display: grid; place-items: center; color: var(--primario); cursor: pointer;
}
@media (max-height: 500px) {
  .leaflet-bottom.leaflet-right .ubicame {
    position: absolute; margin: 0; bottom: 30px; right: calc(max(12px, env(safe-area-inset-right)) + 46px + 10px);
  }
}

/* D-60 (Miguel, 21 nov 2026, 1:42 am): pantalla baja (teléfono acostado, 500 px de
   alto o menos). (1) El zoom baja hasta arriba del pie para no encimarse con el botón
   de paradas; con una ruta elegida va al lado del chip (el chip deja libre la orilla
   derecha). (2) El menú sube: menos aire arriba, bajo la cabeza y bajo las pestañas,
   y abajo solo el renglón del pie. */
@media (max-height: 500px) {
  .leaflet-control-zoom.leaflet-bar { margin-bottom: 30px; }
  /* Ajuste (Miguel, 1:49 am): con ruta elegida, el chip va a la izquierda y en
     vertical, tres píldoras apiladas (insignia, nombre, «Ver detalle»), 30 % más
     chico en letra, íconos y márgenes, para que se vea el mapa. «Ver detalle» se ve
     de 31 px pero se puede tocar en 44 px (área táctil mínima). */
  .chip-ruta {
    right: auto; left: max(12px, env(safe-area-inset-left)); bottom: 26px;
    flex-direction: column; align-items: flex-start; gap: 4px; max-width: 190px;
    padding: 0; background: none; box-shadow: none; border-radius: 0;
  }
  .chip-ruta .camion { font-size: 13px; padding: 4px 8px 4px 6px; box-shadow: var(--sombra); }
  .chip-ruta .camion svg { width: 13px; height: 13px; }
  .chip-ruta .nombre-chip {
    flex: none; padding: 5px 11px; border-radius: 999px; background: var(--tarjeta);
    box-shadow: var(--sombra); font-size: 9.5px;
  }
  .chip-ruta .nombre-chip small { font-size: 8px; }
  .chip-ruta .ver { position: relative; min-height: 31px; padding: 0 10px; border-radius: 999px; font-size: 10px; box-shadow: var(--sombra); }
  .chip-ruta .ver::after { content: ''; position: absolute; inset: -7px -4px; }
  .hoja { padding-top: 6px; padding-bottom: 18px; }
  .hoja-cabeza { padding-bottom: 0; }
  .pestanas { margin-bottom: 6px; }
}

/* ── Computadora ── D-59, 2: ancho de 768 px o más Y alto de más de 500 px. Un
   teléfono acostado (unos 844 × 390) se queda con la vista de teléfono. */
@media (min-width: 768px) and (min-height: 501px) {
  .barra { top: 0; left: 0; right: 0; height: 60px; padding: 0 12px; gap: 10px; background: var(--primario); box-shadow: 0 2px 10px rgba(18,38,45,.18); z-index: 1300; }
  .redondo.menu { width: 48px; height: 48px; border-radius: 12px; background: transparent; box-shadow: none; color: #fff; }
  .marca-barra { display: block; color: #fff; font-size: 20px; font-weight: 800; margin-right: 16px; }
  .buscar { flex: 0 1 460px; height: 44px; box-shadow: none; font-size: 15px; }
  .redondo.paradas { width: 44px; height: 44px; box-shadow: none; }
  .redondo.paradas.activo { background: var(--acento); color: var(--tinta); }
  .pie { text-align: right; font-size: 10px; }
  .aviso-mapa { bottom: 16px; }
  .chip-ruta { bottom: 32px; }
  .mapa { top: 60px; }
  .abierto .mapa { left: 400px; }
  .abierto .aviso-mapa, .abierto .chip-ruta { left: 400px; }
  .abierto .aviso-mapa { transform: none; left: calc(400px + (100% - 400px) / 2); translate: -50% 0; }
  .velo { display: none !important; }
  .hoja { top: 60px; width: 400px; border-radius: 0; box-shadow: 1px 0 0 var(--borde); padding: 0 16px 24px; }
  .hoja-cabeza { display: none; }
  .pestanas button { min-height: 52px; font-size: 14px; }
  .rejilla { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } /* D-55: 3 columnas (10:20 pm) */
  .rejilla.cerca { grid-template-columns: repeat(4, minmax(0, 1fr)); } /* como en la app (D-53); D-57 no lo cambia */
  .chip-ruta { left: auto; right: auto; width: 420px; left: 50%; transform: translateX(-50%); }
  .bienvenida { left: 16px; right: auto; bottom: 28px; width: 400px; padding: 20px 20px 14px; }
  .bienvenida h2 { font-size: 21px; }
}
</style>

<body>
<div class="app cerrado" id="app">
  <main id="mapa" class="mapa" aria-label="Mapa de San Juan del Río"></main>
  <header class="barra">
    <button class="redondo menu" aria-label="Menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span class="marca-barra">SJDR Bus</span>
    <button class="buscar" id="buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d7a72" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>¿A dónde quieres ir?</button>
    <button class="redondo paradas" id="boton-paradas" aria-label="Ver paradas" aria-pressed="false"></button>
  </header>
  <p class="pie">Iniciativa ciudadana independiente · no oficial · datos en proceso de validación · Maqueta D-56 fase 2 · Resultados · ESQUEMÁTICO · <a href="https://leafletjs.com">Leaflet</a> | © <a href="https://www.openstreetmap.org/copyright">colaboradores de OpenStreetMap</a></p>
  <div id="flotante"></div>
  <div class="velo"></div>
  <aside class="hoja" aria-label="Menú de SJDR Bus">
    <div class="hoja-cabeza">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/></svg></div>
      <div class="hoja-marca"><h1 class="nombre-app">SJDR Bus</h1><p class="leyenda">Iniciativa ciudadana independiente</p></div>
      <button class="cerrar" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12262d" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <nav class="pestanas">
      <button id="p-rutas" class="activo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5" stroke-dasharray="3 3"/></svg>Rutas</button>
      <button id="p-calcula"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Calcula tu ruta</button>
    </nav>
    <div class="hoja-cuerpo" id="cuerpo"></div>
  </aside>
</div>
<script src="../../../node_modules/leaflet/dist/leaflet.js"></script>
<script src="../d53/datos-maqueta.js"></script>
<script src="lugares-maqueta.js"></script>
<script>
const { rutas, paradas } = window.MAQUETA;
const vista = new URLSearchParams(location.search).get('vista') || 'inicio';
const app = document.getElementById('app');
const cuerpo = document.getElementById('cuerpo');
const flotante = document.getElementById('flotante');

// Pictograma del pin de parada (D-49), en versión de botón: camión de frente.
const BUS = (c = 'currentColor', v = '#fff') => `<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="2.5" width="15" height="15" rx="3" fill="${c}"/><rect x="6.5" y="4.6" width="11" height="5.6" rx="1" fill="${v}"/><circle cx="8.3" cy="13.8" r="1.2" fill="${v}"/><circle cx="15.7" cy="13.8" r="1.2" fill="${v}"/><rect x="6" y="17.5" width="3" height="3" rx=".7" fill="${c}"/><rect x="15" y="17.5" width="3" height="3" rx=".7" fill="${c}"/></svg>`;
// Ajuste 2 (6:57 pm): parada como círculo levantado; una guía de puntitos baja al punto exacto.
// Ajuste 3 (7:03 pm): el círculo lleva el camión de frente.
const PARADA = '<svg width="26" height="44" viewBox="0 0 26 44" aria-hidden="true"><line x1="13" y1="25" x2="13" y2="40" stroke="#0d7a72" stroke-width="2" stroke-dasharray="0.1 3.4" stroke-linecap="round"/><circle cx="13" cy="41.5" r="2.2" fill="#0d7a72" stroke="#fff" stroke-width="1"/><circle cx="13" cy="13" r="11" fill="#0d7a72" stroke="#fff" stroke-width="2.5"/><rect x="8" y="6.5" width="10" height="10" rx="2" fill="#fff"/><rect x="9.3" y="7.9" width="7.4" height="3.6" rx=".6" fill="#0d7a72"/><circle cx="10.3" cy="14.2" r=".9" fill="#0d7a72"/><circle cx="15.7" cy="14.2" r=".9" fill="#0d7a72"/><rect x="8.9" y="16.5" width="2" height="2" rx=".5" fill="#fff"/><rect x="15.1" y="16.5" width="2" height="2" rx=".5" fill="#fff"/></svg>';
const icParada = () => icono(PARADA, [26, 44], [13, 41.5]);
const PIN = '<svg width="30" height="38" viewBox="0 0 30 38"><path d="M15 37s12-12.2 12-22A12 12 0 0 0 3 15c0 9.8 12 22 12 22z" fill="#0d7a72" stroke="#fff" stroke-width="2"/><rect x="8" y="6" width="14" height="13" rx="2.6" fill="#fff"/><rect x="9.8" y="8" width="10.4" height="5" rx="1" fill="#0d7a72"/><path d="M15 8v5" stroke="#fff" stroke-width="1.2"/><circle cx="11.2" cy="16.2" r="1.1" fill="#0d7a72"/><circle cx="18.8" cy="16.2" r="1.1" fill="#0d7a72"/><rect x="9.4" y="18.4" width="2.8" height="2.4" rx=".6" fill="#fff"/><rect x="17.8" y="18.4" width="2.8" height="2.4" rx=".6" fill="#fff"/></svg>';
const BUS_CHICO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14"/><circle cx="9" cy="13.5" r=".7" fill="currentColor"/><circle cx="15" cy="13.5" r=".7" fill="currentColor"/><path d="M8 20v-3M16 20v-3"/></svg>';
const RELOJ = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const PARADAS_ICONO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><path d="M6 8v8"/></svg>';
document.getElementById('boton-paradas').innerHTML = BUS();

// D-53, 4: 20 colores propios en rotación, todos con contraste AA (≥ 4.5:1)
// con su texto. Las intermunicipales llevan uno aparte. Ninguno es oficial.
const OSCURO = '#12262d';
const ROTACION = ['#0d7a72', '#b5462c', '#1d5b8f', '#f0a032', '#12262d', '#2e7d32', '#9c3d6e', '#8a5a00', '#0f6e8c', '#c2410c',
  '#3d5a40', '#e8b84a', '#7a3b2e', '#1b7f5a', '#a33b3b', '#5b6b2f', '#9ad1c8', '#2f4a6d', '#f2c6a0', '#6d4c41'];
const CLAROS = new Set(['#f0a032', '#e8b84a', '#9ad1c8', '#f2c6a0']);
const INTER = '#4b3f8f';
const color = (i) => {
  const r = rutas[i];
  const fondo = r.tipo === 'intermunicipal' ? INTER : ROTACION[rutas.slice(0, i).filter((x) => x.tipo === 'urbana').length % ROTACION.length];
  const claro = CLAROS.has(fondo);
  return { fondo, texto: claro ? OSCURO : '#fff', insignia: claro ? OSCURO : fondo };
};
// Insignia (D-50, 2): R urbanas, T intermunicipales, sin ceros. «Ruta 001» no se ve (D-53, 6:23 pm).
const insignia = (r) => (r.tipo === 'intermunicipal' ? 'T' : 'R') + r.numero.replace(/^0+(?=\d)/, '');
const camion = (t) => `<span class="camion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M8 20v-3M16 20v-3"/></svg><strong>${t}</strong></span>`;
const estilo = (i) => { const c = color(i); return `--c:${c.fondo};--ct:${c.texto};--ci:${c.insignia}`; };
// D-55 (9:58 pm): tarjeta partida. El camión de frente es el mismo pictograma del botón
// de paradas: cuerpo del color del texto, ventanas del color de la tarjeta.
const tarjeta = (i) => {
  const c = color(i);
  return `<button class="tarjeta partida" style="${estilo(i)}"><span class="lado">${BUS(c.texto, c.fondo)}<span class="insignia">${insignia(rutas[i])}</span></span><span class="tarjeta-nombre">${rutas[i].nombre}</span></button>`;
};
// 10:10 pm: el nombre toma el tamaño de letra más grande (de 11 a 7.5 px) que cabe
// completo en su mitad de la tarjeta sin partir palabras. Debajo de 9 px, letra delgada.
function ajustarLetra() {
  for (const n of document.querySelectorAll('.tarjeta.partida .tarjeta-nombre')) {
    // El guion «–» se pega a la palabra vecina más corta: nunca queda solo en un renglón.
    const pal = n.textContent.split(' ');
    pal.forEach((w, k) => { if (w === '–' && k > 0 && k < pal.length - 1) {
      if (pal[k - 1].length <= pal[k + 1].length) { pal[k - 1] = `<b>${pal[k - 1]} –</b>`; pal[k] = ''; }
      else { pal[k + 1] = `<b>– ${pal[k + 1]}</b>`; pal[k] = ''; } } });
    n.innerHTML = `<span>${pal.filter(Boolean).join(' ')}</span>`; const s = n.firstChild;
    let f = 11;
    for (; f > 7.5; f -= 0.25) {
      s.style.fontSize = f + 'px'; s.style.fontWeight = f < 9 ? '300' : '400';
      if (s.scrollWidth <= n.clientWidth && s.getBoundingClientRect().height <= n.clientHeight - 4) break; // 2 px libres arriba y abajo
    }
    n.dataset.letra = f;
  }
}

const dist = (a, b) => {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));

      <p class="nota">Tu ubicación no sale del teléfono.${salida === yo ? ` Maqueta: ubicación de muestra (${yo.nombre}).` : ''}</p>
      <p class="nota">Lugares: OpenStreetMap, consulta del ${window.LUGARES.consultado.slice(8, 10)} nov ${window.LUGARES.consultado.slice(0, 4)}. </p>
      <p class="proximamente">Próximamente (fases posteriores): qué ruta tomar desde tu parada, el recorrido de cada ruta y el camino a pie por calles.</p>
    </div>`;

  // Mapa: salida, destino y sus dos paradas. Sin línea entre ellas (regla 1).
  const puntos = [];
  // El lugar: un punto de su color y la etiqueta DEBAJO, para no tapar el ícono de la
  // parada, que se dibuja hacia arriba de su punto (visto en la captura a 1280 px).
  const etiqueta = (p, texto, c) => {
    L.circleMarker([p.lat, p.lon], { radius: 6, color: '#fff', weight: 2.5, fillColor: c, fillOpacity: 1 }).addTo(mapa);
    L.marker([p.lat, p.lon], { icon: icono(`<span style="background:${c}">${texto}</span>`, [220, 26], [110, -10], 'pin-lugar'), zIndexOffset: -100 }).addTo(mapa);
  };
  const marcaParada = (p) => L.marker([p.lat, p.lon], { icon: L.divIcon({ className: 'pin', html: PARADA, iconSize: [26, 44], iconAnchor: [13, 41.5], popupAnchor: [0, -32] }) }).addTo(mapa)
    .bindPopup(`<div class="ficha-parada"><b>${p.nombre || 'Parada sin nombre en OpenStreetMap'}</b><span>Fuente: OpenStreetMap</span><span>Consulta del 18 nov 2026</span><span class="marca-verificar">POR VERIFICAR EN CAMPO</span><span>No está ligada a ninguna ruta todavía.</span></div>`, { maxWidth: 260 });
  if (salida) {
    if (escrita) etiqueta(escrita, `Sales de: ${escrita.nombre}`, '#0d7a72');
    else L.marker([yo.lat, yo.lon], { icon: icono('<div class="yo"></div>', [16, 16], [8, 8], 'pin') }).addTo(mapa);
    marcaParada(pSal);
    puntos.push([salida.lat, salida.lon], [pSal.lat, pSal.lon]);
  }
  if (dest) {
    etiqueta(dest, `Destino: ${dest.nombre}`, '#a8432a');
    const m = marcaParada(pDest);
    puntos.push([dest.lat, dest.lon], [pDest.lat, pDest.lon]);
    if (estado === 'mapa') {
      // Como D-57: en el teléfono se cierra el menú; el mapa se centra en la parada y abre su ficha.
      mapa.setView([pDest.lat, pDest.lon], 17);
      setTimeout(() => m.openPopup(), 300);
      return;
    }
  }
  if (puntos.length) mapa.fitBounds(puntos, escritorio ? { paddingTopLeft: [420, 80], paddingBottomRight: [80, 80] } : { padding: [40, 40] });
}

// ── Arranque según la vista ──
const abrir = () => { app.classList.remove('cerrado'); app.classList.add('abierto'); };
if (vista === 'menu') { abrir(); selector(); ajustarLetra(); }
// D-55, 1: bienvenida. Textos, botones y la nota «sale solo la primera vez» son la
// PROPUESTA de la maqueta: Miguel los decide uno por uno.
if (vista === 'bienvenida') {
  const X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12262d" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  flotante.innerHTML = `
    <section class="bienvenida" role="dialog" aria-labelledby="t-bienvenida">
      <div class="bienvenida-cabeza"><h2 id="t-bienvenida">Así funciona</h2><button class="cerrar" aria-label="Cerrar">${X}</button></div>
      <ol class="pasos">
        <li><span class="num">1</span><span><strong>Elige tu ruta</strong> en el menú ☰ y mira dónde empieza y dónde termina.</span></li>
        <li><span class="num">2</span><span><strong>Escribe a dónde quieres ir</strong> y ve qué rutas empiezan o terminan cerca.</span></li>
        <li><span class="num">3</span><span><strong>Toca el camión</strong> de arriba para ver las paradas en el mapa.</span></li>
      </ol>
      <div class="acciones"><button class="lleno">Elegir ruta</button><button class="borde">¿A dónde quieres ir?</button></div>
      <p class="recuerda">Sale solo la primera vez. Se recuerda en este dispositivo, sin cookies.</p>
    </section>`;
}
if (vista === 'detalle' || vista === 'ruta') {
  const i = idx('001');
  const pts = zonas(rutas[i]);
  if (vista === 'detalle') { abrir(); detalle(i); }
  else {
    const r = rutas[i];
    flotante.innerHTML = `<div class="chip-ruta">${camion(insignia(r)).replace('class="camion"', `class="camion" style="${estilo(i)};background:${color(i).fondo};color:${color(i).texto}"`)}<span class="nombre-chip">${r.nombre}<small>Ida · zonas aproximadas (estimado)</small></span><button class="ver">Ver detalle</button></div>`;
  }
  setTimeout(() => { mapa.invalidateSize(); mapa.fitBounds(pts, { padding: escritorio ? [120, 120] : [70, 70] }); }, 50);
}
if (vista === 'paradas') {
  const bp = document.getElementById('boton-paradas');
  bp.classList.add('activo');
  bp.innerHTML = BUS(escritorio ? '#12262d' : '#fff', escritorio ? '#f0a032' : '#0d7a72');
  paradas.forEach((p) => L.marker([p.lat, p.lon], { icon: icParada() }).addTo(mapa));
  flotante.innerHTML = `<div class="aviso-mapa">${paradas.length} paradas de OpenStreetMap · por verificar en campo</div>`;
}
if (vista === 'destino' || vista === 'ubicado' || vista === 'parada-mapa') {
  abrir();
  document.getElementById('p-rutas').classList.remove('activo');
  document.getElementById('p-calcula').classList.add('activo');
  if (vista === 'parada-mapa' && !escritorio) { app.classList.add('cerrado'); app.classList.remove('abierto'); }
  setTimeout(() => { mapa.invalidateSize(); destino(vista === 'parada-mapa' ? 'mapa' : vista === 'ubicado'); }, 50);
}
// D-56f2: vistas de la fase 2 (misma pestaña «Calcula tu ruta»).
if (vista.startsWith('f2-')) {
  abrir();
  document.getElementById('p-rutas').classList.remove('activo');
  document.getElementById('p-calcula').classList.add('activo');
  const estado = vista.slice(3);
  if (estado === 'mapa' && !escritorio) { app.classList.add('cerrado'); app.classList.remove('abierto'); }
  setTimeout(() => { mapa.invalidateSize(); destinoF2(estado); }, 50);
}
setTimeout(() => mapa.invalidateSize(), 60);
</script>
</body>
</html>
