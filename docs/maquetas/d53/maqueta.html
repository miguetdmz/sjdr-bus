<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Maqueta D-53 · SJDR Bus · ESQUEMÁTICO</title>
<!-- D-53 · maqueta (D-54). Pantallas de muestra, sin la lógica de la app.
     Datos reales: datos-maqueta.js (sale de web/public/datos con armar-datos.mjs).
     Mapa real: Leaflet + OpenStreetMap (regla 6). Nunca se publica como la app.
     Vistas: ?vista=inicio | menu | detalle | ruta | paradas | destino -->
<link rel="stylesheet" href="../../../node_modules/leaflet/dist/leaflet.css" />
<style>
:root {
  --tinta: #12262d; --primario: #0d7a72; --primario-suave: #e3f2ef;
  --acento: #f0a032; --acento-suave: #fdf0dc; --fondo: #f4f2ec; --tarjeta: #fff;
  --suave: #566870; --borde: #e3e0d8; --sombra: 0 10px 30px rgba(18, 38, 45, .16);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color: var(--tinta); background: var(--fondo);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
button { font: inherit; color: inherit; }
.app { position: fixed; inset: 0; overflow: hidden; }
.mapa { position: absolute; inset: 0; }
.leaflet-tile-pane { filter: grayscale(.82) brightness(1.05) contrast(.9) sepia(.08); }
.leaflet-control-zoom { display: none; }

/* ── Barra de arriba (teléfono): ☰ · «¿A dónde quieres ir?» · paradas ── */
.barra {
  position: absolute; z-index: 1000; top: 10px; left: 10px; right: 10px;
  display: flex; align-items: center; gap: 8px;
}
.redondo {
  flex: none; width: 52px; height: 52px; border: 0; border-radius: 50%;
  background: var(--tarjeta); box-shadow: var(--sombra); display: grid; place-items: center; cursor: pointer;
  color: var(--tinta);
}
.redondo.paradas { color: var(--primario); }
.redondo.paradas.activo { background: var(--primario); color: #fff; }
.marca-barra { display: none; }
.buscar {
  flex: 1; min-width: 0; height: 52px; border: 0; border-radius: 26px; background: var(--tarjeta);
  box-shadow: var(--sombra); display: flex; align-items: center; gap: 10px; padding: 0 16px;
  font-size: 16px; font-weight: 600; color: var(--suave); text-align: left; cursor: text;
}
.buscar svg { flex: none; }

.pie {
  /* D-53, ajuste de Miguel (6:49 pm): todo lo legal junto, abajo, chico y en verde:
     leyenda de iniciativa, sello de maqueta y atribución de OpenStreetMap (regla 6). */
  position: absolute; z-index: 1250; left: 0; right: 0; bottom: 0; margin: 0; padding: 3px 10px;
  font-size: 9px; line-height: 1.3; text-align: center; color: var(--primario);
  /* Ajuste 2 (6:57 pm): sin fondo, pegado abajo; un halo blanco lo deja leer sobre el mapa. */
  background: none; padding: 1px 10px 2px; text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff;
}
.pie a { color: inherit; }
.aviso-mapa {
  position: absolute; z-index: 950; left: 50%; transform: translateX(-50%); bottom: 25px;
  max-width: calc(100% - 24px); padding: 0 10px; background: none; text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff;
  font-size: 11px; line-height: 1.35; text-align: center; white-space: nowrap; color: var(--primario);
}

/* Ruta elegida con el menú cerrado: chip abajo */
.chip-ruta {
  position: absolute; z-index: 950; left: 12px; right: 12px; bottom: 44px;
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px;
  border-radius: 18px; background: var(--tarjeta); box-shadow: var(--sombra);
}
.chip-ruta .camion { font-size: 19px; padding: 6px 11px 6px 9px; border-radius: 10px; }
.chip-ruta .camion svg { width: 19px; height: 19px; }
.chip-ruta .nombre-chip { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; line-height: 1.25; }
.chip-ruta .nombre-chip small { display: block; font-weight: 500; color: var(--suave); font-size: 11.5px; }
.chip-ruta .ver { flex: none; min-height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: var(--primario); color: #fff; font-weight: 700; font-size: 14px; }

/* ── Menú lateral ── */
.velo { position: absolute; inset: 0; z-index: 1150; background: rgba(18,38,45,.28); }
.hoja {
  position: absolute; z-index: 1200; top: 0; left: 0; bottom: 0; width: min(380px, 88vw);
  background: var(--tarjeta); display: flex; flex-direction: column;
  border-radius: 0 22px 0 0; box-shadow: var(--sombra); padding: 14px 16px 36px;
}
.cerrado .hoja, .cerrado .velo { display: none; }
.hoja-cabeza { flex: none; display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--primario); display: grid; place-items: center; }
.hoja-marca { flex: 1; min-width: 0; }
.nombre-app { margin: 0; font-size: 16px; line-height: 1.2; }
.leyenda { margin: 0; font-size: 11px; color: var(--suave); }
.cerrar { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--fondo); display: grid; place-items: center; }

/* Pestañas arriba (D-53, 8) */
.pestanas { flex: none; display: grid; grid-template-columns: 1fr 1fr; margin: 0 -16px 12px; border-bottom: 1px solid var(--borde); }
.pestanas button {
  min-height: 46px; border: 0; background: none; font-size: 13px; font-weight: 700; color: var(--suave);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.pestanas .activo { color: var(--primario); box-shadow: inset 0 -3px 0 var(--primario); }

.hoja-cuerpo { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; }
.hoja-cuerpo > * { flex-shrink: 0; }
/* Ajuste 2 (6:57 pm): las leyendas (estimado, maqueta, próximamente) juntas, hasta abajo. */
.leyendas { margin-top: auto; padding-top: 18px; display: grid; gap: 4px; }
.leyendas p { margin: 0; }
.titulo-seccion { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }
.fila-titulo { display: flex; align-items: center; justify-content: space-between; }
.borrar { min-height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: var(--fondo); font-size: 12px; font-weight: 700; color: var(--suave); }
.aviso-colores { margin: 2px 0 8px; font-size: 10.5px; line-height: 1.35; color: var(--suave); }
.recientes { margin-bottom: 12px; }

/* Tarjetas (D-53, 3 y 4): más chicas, sin «Ruta 001», 20 colores */
.rejilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.tarjeta {
  display: grid; justify-items: start; align-content: start; gap: 3px; min-height: 44px;
  padding: 5px 6px 6px; border: 0; border-radius: 10px; background: var(--c); color: var(--ct);
  text-align: left; box-shadow: 0 1px 4px rgba(18,38,45,.14);
}
.camion {
  display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px 1px 4px; border-radius: 6px;
  background: #fff; color: var(--ci); font-size: 11px; font-weight: 800; line-height: 1.25;
}
.camion svg { width: 11px; height: 11px; }
.tarjeta-nombre {
  font-size: 10px; font-weight: 700; line-height: 1.2;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* Detalle (D-52 + D-53): el sentido vive dentro del menú, sin «Ruta 001» */
.cambiar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cambiar button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: var(--fondo); font-size: 13px; font-weight: 700; color: var(--suave); }
.enc-ruta { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--c); color: var(--ct); }
.enc-ruta .camion { font-size: 16px; padding: 4px 9px 4px 7px; border-radius: 8px; }
.enc-ruta .camion svg { width: 16px; height: 16px; }
.enc-ruta .enc-nombre { font-size: 16px; font-weight: 700; line-height: 1.25; }
.detalle { margin-top: 10px; padding: 12px 14px; border-radius: 16px; background: var(--primario-suave); display: grid; gap: 12px; font-size: 14.5px; }
.segmento { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 22px; background: var(--tarjeta); }
.segmento span { display: grid; place-content: center; min-height: 44px; padding: 4px 8px; border-radius: 19px; font-weight: 700; font-size: 14px; color: var(--suave); text-align: center; }
.segmento span small { font-weight: 500; font-size: 10.5px; }
.segmento .sel { background: var(--primario); color: #fff; }
.renglon { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.renglon .valor { font-weight: 800; }
.renglon .icono { display: inline-grid; color: var(--primario); }
.chip-tipo { padding: 2px 10px; border-radius: 12px; font-size: 12.5px; font-weight: 700; background: var(--tarjeta); color: var(--primario); }
.duracion { display: inline-flex; align-items: center; gap: 5px; color: var(--primario); }
.duracion i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .55; }
.detalle-pie { padding-top: 8px; border-top: 1px solid var(--borde); font-size: 11.5px; color: var(--suave); }
.etiqueta { display: inline-block; padding: 1px 6px; font-size: 10px; font-weight: 800; letter-spacing: .04em; border-radius: 5px; background: var(--acento-suave); color: #8a5300; border: 1px solid #f3cf95; }

/* «¿A dónde quieres ir?» (D-53, 7) */
.campo {
  display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 25px;
  border: 2px solid var(--primario); background: var(--tarjeta); font-size: 16px; font-weight: 600;
}
.campo .cursor { width: 2px; height: 22px; background: var(--primario); margin-left: -8px; }
.bloque { margin-top: 14px; }
.resultado {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 12px;
  border: 0; border-radius: 14px; background: var(--fondo); text-align: left; font-size: 14px; font-weight: 700;
}
.resultado small { display: block; font-weight: 500; font-size: 11.5px; color: var(--suave); }
.resultado.elegido { background: var(--primario-suave); box-shadow: inset 0 0 0 2px var(--primario); }
.rejilla.cerca .tarjeta { height: 74px; }
.rejilla.cerca .tarjeta-nombre { -webkit-line-clamp: 2; }
.tarjeta .dist { margin-top: auto; font-size: 10px; font-weight: 700; opacity: .92; }
.ubicacion { width: 100%; min-height: 46px; border: 0; border-radius: 23px; background: var(--primario); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.nota { margin: 6px 0 0; font-size: 10.5px; line-height: 1.4; color: var(--primario); }
.proximamente { margin: 0; font-size: 10.5px; line-height: 1.4; color: var(--primario); }

/* Marcadores */
.pin { background: none; border: 0; }
.pin svg { display: block; filter: drop-shadow(0 2px 3px rgba(18,38,45,.35)); }
.etq-zona { background: none; border: 0; display: flex; justify-content: center; }
.etq-zona span { padding: 3px 9px; border-radius: 13px; font-size: 12px; font-weight: 800; color: #fff; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(18,38,45,.3); white-space: nowrap; }
.yo { width: 16px; height: 16px; border-radius: 50%; background: #1d5b8f; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(29,91,143,.25); }

/* ── Computadora ── */
@media (min-width: 768px) {
  .barra { top: 0; left: 0; right: 0; height: 60px; padding: 0 12px; gap: 10px; background: var(--primario); box-shadow: 0 2px 10px rgba(18,38,45,.18); z-index: 1300; }
  .redondo.menu { width: 48px; height: 48px; border-radius: 12px; background: transparent; box-shadow: none; color: #fff; }
  .marca-barra { display: block; color: #fff; font-size: 20px; font-weight: 800; margin-right: 16px; }
  .buscar { flex: 0 1 460px; height: 44px; box-shadow: none; font-size: 15px; }
  .redondo.paradas { width: 44px; height: 44px; box-shadow: none; }
  .redondo.paradas.activo { background: var(--acento); color: var(--tinta); }
  .pie { text-align: right; font-size: 10px; }
  .aviso-mapa { bottom: 16px; }
  .chip-ruta { bottom: 32px; }
  .mapa { top: 60px; }
  .abierto .mapa { left: 400px; }
  .abierto .aviso-mapa, .abierto .chip-ruta { left: 400px; }
  .abierto .aviso-mapa { transform: none; left: calc(400px + (100% - 400px) / 2); translate: -50% 0; }
  .velo { display: none !important; }
  .hoja { top: 60px; width: 400px; border-radius: 0; box-shadow: 1px 0 0 var(--borde); padding: 0 16px 24px; }
  .hoja-cabeza { display: none; }
  .pestanas button { min-height: 52px; font-size: 14px; }
  .rejilla { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .chip-ruta { left: auto; right: auto; width: 420px; left: 50%; transform: translateX(-50%); }
}
</style>
</head>
<body>
<div class="app cerrado" id="app">
  <main id="mapa" class="mapa" aria-label="Mapa de San Juan del Río"></main>
  <header class="barra">
    <button class="redondo menu" aria-label="Menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span class="marca-barra">SJDR Bus</span>
    <button class="buscar" id="buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d7a72" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>¿A dónde quieres ir?</button>
    <button class="redondo paradas" id="boton-paradas" aria-label="Ver paradas" aria-pressed="false"></button>
  </header>
  <p class="pie">Iniciativa ciudadana independiente · no oficial · datos en proceso de validación · Maqueta D-53 · ESQUEMÁTICO · <a href="https://leafletjs.com">Leaflet</a> | © <a href="https://www.openstreetmap.org/copyright">colaboradores de OpenStreetMap</a></p>
  <div id="flotante"></div>
  <div class="velo"></div>
  <aside class="hoja" aria-label="Menú de SJDR Bus">
    <div class="hoja-cabeza">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/></svg></div>
      <div class="hoja-marca"><h1 class="nombre-app">SJDR Bus</h1><p class="leyenda">Iniciativa ciudadana independiente</p></div>
      <button class="cerrar" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12262d" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <nav class="pestanas">
      <button id="p-rutas" class="activo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5" stroke-dasharray="3 3"/></svg>Rutas</button>
      <button id="p-calcula"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Calcula tu ruta</button>
    </nav>
    <div class="hoja-cuerpo" id="cuerpo"></div>
  </aside>
</div>
<script src="../../../node_modules/leaflet/dist/leaflet.js"></script>
<script src="datos-maqueta.js"></script>
<script>
const { rutas, paradas } = window.MAQUETA;
const vista = new URLSearchParams(location.search).get('vista') || 'inicio';
const app = document.getElementById('app');
const cuerpo = document.getElementById('cuerpo');
const flotante = document.getElementById('flotante');

// Pictograma del pin de parada (D-49), en versión de botón: camión de frente.
const BUS = (c = 'currentColor', v = '#fff') => `<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="2.5" width="15" height="15" rx="3" fill="${c}"/><rect x="6.5" y="4.6" width="11" height="5.6" rx="1" fill="${v}"/><circle cx="8.3" cy="13.8" r="1.2" fill="${v}"/><circle cx="15.7" cy="13.8" r="1.2" fill="${v}"/><rect x="6" y="17.5" width="3" height="3" rx=".7" fill="${c}"/><rect x="15" y="17.5" width="3" height="3" rx=".7" fill="${c}"/></svg>`;
// Ajuste 2 (6:57 pm): parada como círculo levantado; una guía de puntitos baja al punto exacto.
// Ajuste 3 (7:03 pm): el círculo lleva el camión de frente.
const PARADA = '<svg width="26" height="44" viewBox="0 0 26 44" aria-hidden="true"><line x1="13" y1="25" x2="13" y2="40" stroke="#0d7a72" stroke-width="2" stroke-dasharray="0.1 3.4" stroke-linecap="round"/><circle cx="13" cy="41.5" r="2.2" fill="#0d7a72" stroke="#fff" stroke-width="1"/><circle cx="13" cy="13" r="11" fill="#0d7a72" stroke="#fff" stroke-width="2.5"/><rect x="8" y="6.5" width="10" height="10" rx="2" fill="#fff"/><rect x="9.3" y="7.9" width="7.4" height="3.6" rx=".6" fill="#0d7a72"/><circle cx="10.3" cy="14.2" r=".9" fill="#0d7a72"/><circle cx="15.7" cy="14.2" r=".9" fill="#0d7a72"/><rect x="8.9" y="16.5" width="2" height="2" rx=".5" fill="#fff"/><rect x="15.1" y="16.5" width="2" height="2" rx=".5" fill="#fff"/></svg>';
const icParada = () => icono(PARADA, [26, 44], [13, 41.5]);
const PIN = '<svg width="30" height="38" viewBox="0 0 30 38"><path d="M15 37s12-12.2 12-22A12 12 0 0 0 3 15c0 9.8 12 22 12 22z" fill="#0d7a72" stroke="#fff" stroke-width="2"/><rect x="8" y="6" width="14" height="13" rx="2.6" fill="#fff"/><rect x="9.8" y="8" width="10.4" height="5" rx="1" fill="#0d7a72"/><path d="M15 8v5" stroke="#fff" stroke-width="1.2"/><circle cx="11.2" cy="16.2" r="1.1" fill="#0d7a72"/><circle cx="18.8" cy="16.2" r="1.1" fill="#0d7a72"/><rect x="9.4" y="18.4" width="2.8" height="2.4" rx=".6" fill="#fff"/><rect x="17.8" y="18.4" width="2.8" height="2.4" rx=".6" fill="#fff"/></svg>';
const BUS_CHICO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14"/><circle cx="9" cy="13.5" r=".7" fill="currentColor"/><circle cx="15" cy="13.5" r=".7" fill="currentColor"/><path d="M8 20v-3M16 20v-3"/></svg>';
const RELOJ = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const PARADAS_ICONO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><path d="M6 8v8"/></svg>';
document.getElementById('boton-paradas').innerHTML = BUS();

// D-53, 4: 20 colores propios en rotación, todos con contraste AA (≥ 4.5:1)
// con su texto. Las intermunicipales llevan uno aparte. Ninguno es oficial.
const OSCURO = '#12262d';
const ROTACION = ['#0d7a72', '#b5462c', '#1d5b8f', '#f0a032', '#12262d', '#2e7d32', '#9c3d6e', '#8a5a00', '#0f6e8c', '#c2410c',
  '#3d5a40', '#e8b84a', '#7a3b2e', '#1b7f5a', '#a33b3b', '#5b6b2f', '#9ad1c8', '#2f4a6d', '#f2c6a0', '#6d4c41'];
const CLAROS = new Set(['#f0a032', '#e8b84a', '#9ad1c8', '#f2c6a0']);
const INTER = '#4b3f8f';
const color = (i) => {
  const r = rutas[i];
  const fondo = r.tipo === 'intermunicipal' ? INTER : ROTACION[rutas.slice(0, i).filter((x) => x.tipo === 'urbana').length % ROTACION.length];
  const claro = CLAROS.has(fondo);
  return { fondo, texto: claro ? OSCURO : '#fff', insignia: claro ? OSCURO : fondo };
};
// Insignia (D-50, 2): R urbanas, T intermunicipales, sin ceros. «Ruta 001» no se ve (D-53, 6:23 pm).
const insignia = (r) => (r.tipo === 'intermunicipal' ? 'T' : 'R') + r.numero.replace(/^0+(?=\d)/, '');
const camion = (t) => `<span class="camion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M8 20v-3M16 20v-3"/></svg><strong>${t}</strong></span>`;
const estilo = (i) => { const c = color(i); return `--c:${c.fondo};--ct:${c.texto};--ci:${c.insignia}`; };
const tarjeta = (i) => `<button class="tarjeta" style="${estilo(i)}">${camion(insignia(rutas[i]))}<span class="tarjeta-nombre">${rutas[i].nombre}</span></button>`;
const idx = (num) => rutas.findIndex((r) => r.numero === num);

// Distancia en línea recta (haversine), en metros.
const dist = (a, b) => {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const redondeo = (m) => (m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`);

// ── Mapa real ──
const escritorio = innerWidth >= 768;
const mapa = L.map('mapa', { zoomControl: false, attributionControl: false }).setView([20.389, -99.975], escritorio ? 14 : 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">colaboradores de OpenStreetMap</a>',
}).addTo(mapa);
const icono = (html, size, anchor, cls = 'pin') => L.divIcon({ className: cls, html, iconSize: size, iconAnchor: anchor });

function zonas(r) {
  const { origen, destino } = r.extremos;
  const puntos = [];
  for (const [papel, z, c] of [['Inicio', origen, '#0d7a72'], ['Fin', destino, '#a8432a']]) {
    if (z.faltante || z.lat == null) continue;
    L.circle([z.lat, z.lon], { radius: z.radio_m, color: c, fillColor: c, fillOpacity: .14, weight: 2.5, dashArray: '6 6' }).addTo(mapa);
    L.marker([z.lat, z.lon], { icon: icono(`<span style="background:${c}">${papel}: ${z.lugar}</span>`, [180, 26], [90, 13], 'etq-zona') }).addTo(mapa);
    puntos.push([z.lat, z.lon]);
  }
  return puntos;
}

// ── Vistas ──
function selector() {
  const recientes = ['001', '012', '062'].map(idx);
  cuerpo.innerHTML = `
    <section class="recientes">
      <div class="fila-titulo"><h3 class="titulo-seccion">Tus rutas recientes</h3><button class="borrar">Borrar</button></div>
      <div class="rejilla">${recientes.map(tarjeta).join('')}</div>
    </section>
    <h3 class="titulo-seccion">Elige tu ruta</h3>
    <p class="aviso-colores">Los colores solo ayudan a distinguir las tarjetas; no indican nada de la ruta.</p>
    <div class="rejilla">${rutas.map((_, i) => tarjeta(i)).join('')}</div>`;
}

function detalle(i, sentido = 'ida') {
  const r = rutas[i];
  const s = r.sentidos?.[sentido];
  const { origen, destino } = r.extremos;
  const puntosDur = s ? Math.max(3, Math.floor(s.duracion_min / 10) + 1) : 0;
  cuerpo.innerHTML = `
    <div class="cambiar"><h3 class="titulo-seccion" style="margin:0">Tu ruta</h3><button>Cambiar ruta</button></div>
    <div class="enc-ruta" style="${estilo(i)}">${camion(insignia(r))}<span class="enc-nombre">${r.nombre}</span></div>
    <div class="detalle">
      <div class="segmento">
        <span class="${sentido === 'ida' ? 'sel' : ''}">Ida<small>${origen.lugar} → ${destino.lugar}</small></span>
        <span class="${sentido === 'vuelta' ? 'sel' : ''}">Vuelta<small>${destino.lugar} → ${origen.lugar}</small></span>
      </div>
      <div class="renglon"><span class="chip-tipo">${r.tipo === 'urbana' ? 'Urbana' : 'Intermunicipal'}</span>
        ${s ? `<span class="icono">${PARADAS_ICONO}</span><span class="valor">${s.paradas}</span> paradas` : ''}</div>
      ${s ? `<div class="renglon"><span class="duracion">${BUS_CHICO}${'<i></i>'.repeat(puntosDur)}${BUS_CHICO}</span><span class="valor">${s.duracion_min} min</span></div>
      <div class="renglon"><span class="icono">${RELOJ}</span><span class="valor">${s.horario ? `${s.horario.inicio} a ${s.horario.fin}` : 'Por verificar en campo'}</span></div>` : ''}
      <div class="detalle-pie"><span class="etiqueta">NIVEL C · RECORRIDO POR VERIFICAR</span><br>El recorrido todavía no se dibuja en el mapa: está por verificar.</div>
    </div>`;
}

// Catálogo guardado: los lugares de inicio y fin de las 39 rutas (D-53, a).
function catalogo() {
  const m = new Map();
  rutas.forEach((r) => { for (const z of [r.extremos.origen, r.extremos.destino]) if (!z.faltante && z.lat != null && !m.has(z.lugar)) m.set(z.lugar, z); });
  return [...m.values()];
}

function destino() {
  const texto = 'Hospital General';
  const norm = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const encontrados = catalogo().filter((z) => norm(z.lugar).includes(norm(texto)));
  const dest = encontrados[0];
  // D-53, c: rutas que empiezan o terminan a 1 km o menos (criterio de trabajo, ESTIMADO).
  const RADIO = 1000;
  const cerca = rutas.map((r, i) => {
    const d = Math.min(...[r.extremos.origen, r.extremos.destino].filter((z) => z.lat != null).map((z) => dist(dest, z)));
    return { i, d };
  }).filter((x) => x.d <= RADIO).sort((a, b) => a.d - b.d);
  // D-53, b: parada de OSM más cercana a una ubicación de MUESTRA (en la app será el GPS del teléfono).
  const yo = { lat: 20.38883, lon: -99.99639, lugar: 'Centro' };
  const parada = paradas.map((p) => ({ ...p, d: dist(yo, p) })).sort((a, b) => a.d - b.d)[0];

  cuerpo.innerHTML = `
    <h3 class="titulo-seccion">¿A dónde quieres ir?</h3>
    <div class="campo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d7a72" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>${texto}<span class="cursor"></span></div>
    <div class="bloque">
      <h3 class="titulo-seccion">Lugares guardados</h3>
      ${encontrados.map((z) => `<button class="resultado elegido"><span style="color:#a8432a">${BUS_CHICO}</span><span>${z.lugar}<small>Inicio o fin de ruta · zona aproximada</small></span></button>`).join('')}
    </div>
    <div class="bloque">
      <h3 class="titulo-seccion">Rutas que empiezan o terminan cerca</h3>
      <div class="rejilla cerca">${cerca.map(({ i, d }) => `<button class="tarjeta" style="${estilo(i)}">${camion(insignia(rutas[i]))}<span class="tarjeta-nombre">${rutas[i].nombre}</span><span class="dist">${d < 50 ? 'ahí' : 'a ' + redondeo(d)}</span></button>`).join('')}</div>
    </div>
    <div class="bloque">
      <h3 class="titulo-seccion">Tu parada más cercana</h3>
      <button class="ubicacion">${BUS('#fff', '#0d7a72')}Usar mi ubicación</button>
    </div>
    <div class="leyendas">
      <p class="nota">estimado · distancia en línea recta a la zona de inicio o fin de cada ruta, hasta 1 km.</p>
      <p class="nota">Maqueta: con una ubicación de muestra (${yo.lugar}), la parada más cercana queda a ${redondeo(parada.d)} en línea recta y se marca en el mapa · por verificar en campo. Tu ubicación no sale del teléfono.</p>
      <p class="proximamente">Próximamente (fases posteriores): qué ruta tomar desde tu parada, el recorrido de cada ruta y el camino a pie por calles.</p>
    </div>`;

  mapa.setView([(dest.lat + yo.lat) / 2, (dest.lon + yo.lon) / 2], escritorio ? 14 : 13);
  L.circle([dest.lat, dest.lon], { radius: dest.radio_m, color: '#a8432a', fillColor: '#a8432a', fillOpacity: .14, weight: 2.5, dashArray: '6 6' }).addTo(mapa);
  L.marker([dest.lat, dest.lon], { icon: icono(`<span style="background:#a8432a">Destino: ${dest.lugar}</span>`, [200, 26], [100, 13], 'etq-zona') }).addTo(mapa);
  L.marker([yo.lat, yo.lon], { icon: icono('<div class="yo"></div>', [16, 16], [8, 8], 'pin') }).addTo(mapa);
  L.marker([parada.lat, parada.lon], { icon: icParada() }).addTo(mapa);
  if (escritorio) mapa.fitBounds([[dest.lat, dest.lon], [yo.lat, yo.lon]], { padding: [80, 80] });
}

// ── Arranque según la vista ──
const abrir = () => { app.classList.remove('cerrado'); app.classList.add('abierto'); };
if (vista === 'menu') { abrir(); selector(); }
if (vista === 'detalle' || vista === 'ruta') {
  const i = idx('001');
  const pts = zonas(rutas[i]);
  if (vista === 'detalle') { abrir(); detalle(i); }
  else {
    const r = rutas[i];
    flotante.innerHTML = `<div class="chip-ruta">${camion(insignia(r)).replace('class="camion"', `class="camion" style="${estilo(i)};background:${color(i).fondo};color:${color(i).texto}"`)}<span class="nombre-chip">${r.nombre}<small>Ida · zonas aproximadas (estimado)</small></span><button class="ver">Ver detalle</button></div>`;
  }
  setTimeout(() => { mapa.invalidateSize(); mapa.fitBounds(pts, { padding: escritorio ? [120, 120] : [70, 70] }); }, 50);
}
if (vista === 'paradas') {
  const bp = document.getElementById('boton-paradas');
  bp.classList.add('activo');
  bp.innerHTML = BUS(escritorio ? '#12262d' : '#fff', escritorio ? '#f0a032' : '#0d7a72');
  paradas.forEach((p) => L.marker([p.lat, p.lon], { icon: icParada() }).addTo(mapa));
  flotante.innerHTML = `<div class="aviso-mapa">${paradas.length} paradas de OpenStreetMap · por verificar en campo</div>`;
}
if (vista === 'destino') {
  abrir();
  document.getElementById('p-rutas').classList.remove('activo');
  document.getElementById('p-calcula').classList.add('activo');
  setTimeout(() => { mapa.invalidateSize(); destino(); }, 50);
}
setTimeout(() => mapa.invalidateSize(), 60);
</script>
</body>
</html>
